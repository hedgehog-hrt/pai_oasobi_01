[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-rosa-reproduction"
version = "0.20.17"
description = "ROSA scheduling, measurement contracts and experimental GR00T batch-one adapter"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "docs/LICENSE_SCOPE.md", "LICENSES/*.txt", "LICENSES/SOURCES.json"]
requires-python = ">=3.12"
dependencies = ["ortools==9.14.6206", "jsonschema==4.25.1", "packaging==26.3"]

[project.optional-dependencies]
test = ["pytest==8.4.2"]
media = ["reportlab==4.4.9", "Pillow==12.3.0"]

[project.scripts]
rosa-plan = "rosa_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.package-data]
rosa_repro = ["*.json"]
